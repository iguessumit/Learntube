<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TubeVault">
<title>TubeVault</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF0000'/%3E%3Cpath d='M26 20v24l20-12z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="manifest" id="mf">

(function(){
  try{
    var s=JSON.parse(localStorage.getItem('tv3_settings')||'null');var t=s&&s.theme;
    if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    document.documentElement.classList.toggle('dark',t==='dark');
  }catch(e){}
  try{
    var icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23FF0000'/%3E%3Cpath d='M208 150v212l180-106z' fill='%23fff'/%3E%3C/svg%3E";
    var m={name:'TubeVault',short_name:'TubeVault',start_url:'./',scope:'./',display:'standalone',background_color:'#0f0f0f',theme_color:'#0f0f0f',
      icons:[{src:icon,sizes:'192x192',type:'image/svg+xml',purpose:'any maskable'},{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}],

    document.getElementById('mf').setAttribute('href','data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m)));
  }catch(e){}

</script>
<style>
:root{--card:#f6f6f6;--bg:#fff;--bg2:#f2f2f2;--bg3:#e0e0e0;--sheet:#fff;--tx:#0f0f0f;--tx2:#606060;--line:rgba(0,0,0,.1);--chip:#f2f2f2;--chipa:#0f0f0f;--chipat:#fff;--red:#f00;--blue:#065fd4;
  --top-h:calc(56px + env(safe-area-inset-top,0px));--nav-h:calc(56px + env(safe-area-inset-bottom,0px));--mini-h:0px}
html.dark{--card:#1c1c1c;--bg:#0f0f0f;--bg2:#272727;--bg3:#3f3f3f;--sheet:#212121;--tx:#f1f1f1;--tx2:#aaa;--line:rgba(255,255,255,.14);--chip:#272727;--chipa:#f1f1f1;--chipat:#0f0f0f;--blue:#3ea6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 Roboto,"Segoe UI",Arial,sans-serif;touch-action:manipulation;padding-bottom:calc(var(--nav-h) + var(--mini-h))}
body.has-mini{--mini-h:56px}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:none}
svg{display:block;flex:none}img{display:block}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:var(--bg2)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{height:36px;padding:0 16px;border-radius:18px;background:var(--bg2);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--chipa);color:var(--chipat)}.btn.red{background:var(--red);color:#fff}.btn:active{opacity:.7}
.grow{flex:1}.srow{display:flex;gap:8px;margin-top:14px}.pad{padding:0 12px}
.link{color:var(--blue);font-weight:500;font-size:13px}
.hint{color:var(--tx2);font-size:12px;margin:6px 0 0}
.empty{padding:40px 24px;text-align:center;color:var(--tx2);line-height:1.6}
.sechead{padding:14px 12px 6px;font-size:16px;font-weight:600}

/* top bar */
#topbar{height:var(--top-h);padding:env(safe-area-inset-top,0) 4px 0 14px;display:flex;align-items:center;background:var(--bg)}
.logo{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;letter-spacing:-.04em;cursor:pointer}
.logo i{font-style:normal;color:var(--red)}
.logo .mk{width:28px;height:20px;border-radius:6px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff}

/* chips + feed */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--chip);font-weight:500;white-space:nowrap}
.chip.on{background:var(--chipa);color:var(--chipat)}
.feed{display:grid;grid-template-columns:1fr;gap:0 16px;max-width:1700px;margin:0 auto}
@media(min-width:600px){.feed{grid-template-columns:repeat(2,1fr);padding:8px 8px 0;gap:0 8px}}
@media(min-width:900px){.feed{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1300px){.feed{grid-template-columns:repeat(4,1fr)}}
.card{cursor:pointer;margin:0 8px 14px;background:var(--card);border-radius:16px;overflow:hidden;contain:layout paint style}
.card:active{opacity:.9}
.thumb{position:relative;aspect-ratio:16/9;background:var(--bg2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.dur{position:absolute;right:6px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.35)}
.prog i{display:block;height:100%;background:var(--red)}
.cmeta{display:flex;align-items:center;gap:10px;padding:4px 2px 10px 12px}
.ct{flex:1;min-width:0}
.ct h3{margin:0;font-size:15px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct p{margin:4px 0 0;color:var(--tx2);font-size:12.5px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.avatar.big{width:64px;height:64px;font-size:26px}
.sk{background:var(--bg2);animation:pulse 1.2s ease-in-out infinite}
.sk.line{height:12px;border-radius:6px;margin:6px 0}.sk.line.s{width:60%}
@keyframes pulse{50%{opacity:.5}}

/* library / lists */
.lib-top{display:flex;align-items:center;gap:14px;padding:12px 8px 8px 16px}
.lib-top h1{margin:0;font-size:24px;font-weight:700}.lib-top p{margin:2px 0 0;color:var(--tx2)}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{width:164px;flex:none;cursor:pointer}
.hcard .thumb{border-radius:10px}.hcard h3{margin:8px 0 0;font-size:13.5px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hcard p{margin:2px 0 0;color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:center;padding:18px 12px 8px}
.sec h2{margin:0;font-size:18px;font-weight:600;flex:1;cursor:pointer}
.prow{display:flex;gap:12px;padding:8px 4px 8px 12px;align-items:center;cursor:pointer}
.pthumb{width:150px;aspect-ratio:16/9;border-radius:8px;position:relative;background:var(--bg2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.pthumb::before{content:"";position:absolute;left:10px;right:10px;top:-5px;height:5px;background:var(--bg3);border-radius:6px 6px 0 0}
.pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
.prow h3{margin:0;font-size:15px;font-weight:500}.prow p{margin:3px 0 0;color:var(--tx2);font-size:12.5px}
.row{display:flex;gap:12px;padding:6px 2px 6px 12px;cursor:pointer;align-items:flex-start;content-visibility:auto;contain-intrinsic-size:auto 100px}
.rthumb{width:min(168px,42vw);flex:none;aspect-ratio:16/9;position:relative;border-radius:8px;overflow:hidden;background:var(--bg2)}
.rthumb img{width:100%;height:100%;object-fit:cover}
.row .ct h3{font-size:14px}

/* sub pages */
#sub{position:fixed;left:0;right:0;top:0;bottom:calc(var(--nav-h) + var(--mini-h));display:none;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);z-index:35}
#sub.on{display:block}#sub.full{bottom:0}
.subhead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top,0px)) 6px 8px 4px;background:var(--bg)}
.subhead h2{margin:0;font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox{display:flex;align-items:center;gap:12px;margin:4px 12px 8px;padding:0 14px;height:44px;border-radius:10px;background:var(--bg2);color:var(--tx2)}
.sbox input{border:0;background:none;padding:0;height:100%}
.glabel{padding:16px 12px 6px;font-size:18px;font-weight:600}
.plhero{display:flex;gap:14px;padding:8px 12px 4px;align-items:flex-end}
.plhero .plthumb{width:44vw;max-width:200px;aspect-ratio:16/9;border-radius:10px;background:var(--bg2);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.plhero img{width:100%;height:100%;object-fit:cover}
.plhero h1{margin:0;font-size:22px}.plhero p{margin:4px 0 0;color:var(--tx2)}
.shead2{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px 4px;background:var(--bg);position:sticky;top:0;z-index:5}
.shead2 input{height:42px;border-radius:21px;padding:0 16px}
.qrow{display:flex;align-items:center;gap:16px;width:100%;padding:12px 16px;text-align:left;color:var(--tx)}
.nvid{display:flex;gap:10px;padding:14px 12px 4px;align-items:center;font-weight:600}
.nvid img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.note{display:flex;gap:10px;align-items:center;padding:6px 12px}
.tsb{background:var(--bg2);color:var(--blue);font-weight:600;border-radius:6px;padding:3px 8px;font-size:12.5px;flex:none}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:30}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--tx2)}
#nav button.on{color:var(--tx);font-weight:600}#nav button.on svg{fill:currentColor}

/* player */
#player-layer{position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#player-layer.on{display:flex}
#player-layer.full{background:linear-gradient(#000 env(safe-area-inset-top,0px),var(--bg) 0)}
#pv{position:relative;width:100%;height:min(56.25vw,62vh);background:#000;flex:none;overflow:hidden}
#pv:fullscreen{height:100%}#pv:-webkit-full-screen{height:100%}
#yt-host,#yt-host iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#pbody{flex:1;overflow-y:auto;overscroll-behavior:contain}
#mini-ctrl{display:none}#mini-prog{display:none}
#player-layer.mini{top:auto;bottom:var(--nav-h);height:56px;flex-direction:row;padding-top:0;z-index:45;border-top:1px solid var(--line);background:var(--bg)}
#player-layer.mini #pv{width:100px;height:56px;flex:none}
#player-layer.mini #pbody,#player-layer.mini #ctrl{display:none}
#player-layer.mini #mini-ctrl{display:flex;flex:1;min-width:0;align-items:center}
#player-layer.mini #mini-prog{display:block;position:absolute;left:0;top:0;height:2px;background:var(--red);width:0}
.mt{flex:1;min-width:0;padding:0 10px;cursor:pointer}
.mt h4{margin:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt p{margin:1px 0 0;color:var(--tx2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shield{position:absolute;inset:0;z-index:1}
#ctrl{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(rgba(0,0,0,.6),transparent 30%,transparent 62%,rgba(0,0,0,.7))}
#ctrl.show{opacity:1}#ctrl.show button,#ctrl.show #scrub{pointer-events:auto}
#ctrl button{color:#fff}
.ctop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;padding:4px 6px}
.cmid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(20px,9vw,60px)}
.cmid .big{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.cmid .sm{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.cbot{position:absolute;left:12px;right:6px;bottom:26px;display:flex;align-items:center;color:#fff;font-size:12px;font-weight:500}
#scrub{position:absolute;left:12px;right:12px;bottom:4px;height:24px;touch-action:none;display:flex;align-items:center}
#scrub .tr{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.35);border-radius:2px}
#sc-fill{position:absolute;left:0;height:3px;background:var(--red);width:0;border-radius:2px}
#sc-knob{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--red);margin-left:-6px;left:0}
.badge{position:absolute;top:50%;transform:translateY(-50%);color:#fff;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;z-index:3}
#bl{left:10%}#br{right:10%}.badge.go{animation:bd .6s}
@keyframes bd{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.wp{padding:12px 12px 20px}
#wp-title{font-size:18px;font-weight:600;margin:0 0 2px;line-height:1.3}
.wp small{color:var(--tx2)}
.wp-chan{display:flex;align-items:center;gap:10px;margin:12px 0 10px;font-weight:600}
.wp-acts{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.wp-acts::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--bg2);display:flex;align-items:center;gap:6px;font-weight:500;font-size:13.5px}
.pill.on{color:var(--blue)}.pill.on svg{fill:currentColor}
#notes-box{margin:8px 0;padding:10px;border-radius:12px;background:var(--bg2)}
#notes-box form{display:flex;gap:8px;margin-bottom:6px}
#notes-box form input{background:var(--bg)}
.wp h2{font-size:16px;margin:18px 0 4px}
.wp .row{padding-left:0}

/* sheet, toast */
#sheet-root{position:fixed;inset:0;z-index:80;display:none}#sheet-root.on{display:block}
.sbackdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.spanel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--sheet);border-radius:16px 16px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;animation:up .2s ease-out}
.spanel::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.shead{font-weight:600;font-size:16px;padding:2px 0 8px;line-height:1.3}
.mi{display:flex;align-items:center;gap:16px;width:100%;padding:12px 2px;font-size:15px;text-align:left}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.inrow{display:flex;gap:8px}.inrow .btn{flex:none}
.prev{display:flex;gap:10px;align-items:center;margin-top:12px;padding:8px;background:var(--bg2);border-radius:10px}
.prev img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.prev h4{margin:0;font-size:13px;font-weight:500}.prev p{margin:2px 0 0;color:var(--tx2);font-size:12px}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{flex:1;height:34px;border-radius:8px;font-weight:500}.seg button.on{background:var(--chipa);color:var(--chipat)}
.opt{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);margin-top:8px}
.opt b{display:block;font-size:14px}.opt span{display:block;color:var(--tx2);font-size:12.5px;margin-top:3px}
.opt.on{border-color:var(--blue)}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--red)}
.chk img{width:80px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.chk span{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#imp-list{max-height:34vh;overflow-y:auto}
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--mini-h) + 14px);z-index:90;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#323232;color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;max-width:480px;animation:up .2s ease-out}
#clip{position:fixed;left:8px;right:8px;bottom:calc(var(--nav-h) + var(--mini-h) + 8px);z-index:42;display:none;max-width:540px;margin:0 auto}
#clip.on{display:block}
.cl{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35);border-radius:14px;padding:8px 6px 8px 8px}
.cl img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:6px}.cl h4{margin:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl p{margin:1px 0 0;font-size:11.5px;color:var(--tx2)}
.cl .btn{height:32px;padding:0 12px;font-size:13px}
html,body{overscroll-behavior-y:contain}
#hdr{position:sticky;top:0;z-index:20;background:var(--bg);transition:transform .22s ease;will-change:transform}
#hdr.hide{transform:translateY(-100%)}
#hdr.lib .chips{display:none}
.ctitle{margin:0;padding:12px 14px 6px;font-size:16.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cn{font-size:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{margin:2px 0 0;font-size:13px;color:var(--tx2);white-space:nowrap}
.cact{display:flex;align-items:center;flex:none}
.cact .ib{width:36px;height:36px}.cact .ib.on{color:var(--blue)}.cact .ib.on svg{fill:currentColor}
.btn.outl{background:none;border:1px solid var(--line)}.btn.big{height:40px;padding:0 18px}
.prof{display:flex;align-items:center;gap:16px;padding:14px 8px 10px 16px}
.prof h1{margin:0;font-size:26px;font-weight:700}.prof p{margin:2px 0 0;color:var(--tx2)}
.hcard{width:190px}.hcard h3{margin:0;font-size:14px}.hcard .hrow{display:flex;align-items:flex-start;gap:2px;margin-top:8px}
.ib.hm{width:30px;height:30px;margin-right:-4px}
.subbar{display:flex;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 6px 0 4px}
.bigt{margin:4px 16px 10px;font-size:32px;font-weight:700;letter-spacing:-.02em}
.plbg{background:linear-gradient(hsl(var(--ph) 70% 86%),var(--bg) 380px)}
html.dark .plbg{background:linear-gradient(hsl(var(--ph) 38% 26%),var(--bg) 380px)}
.plbig{margin:6px 12px 0;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.plbig img{width:100%;height:100%;object-fit:cover}
.pltitle{margin:16px 16px 8px;font-size:30px;font-weight:700;letter-spacing:-.02em}
.plby{display:flex;align-items:center;gap:8px;padding:0 16px}.plby .avatar{width:24px;height:24px;font-size:12px}
.plmeta{margin:8px 16px 14px;color:var(--tx2)}
.plbtns{display:flex;gap:10px;padding:0 12px 14px}
.pbig{flex:1;height:48px;border-radius:24px;background:var(--chipa);color:var(--chipat);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.cbtn{width:48px;height:48px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex:none}

<script>
'use strict';
/* ============ helpers ============ */

  tab:'home',chip:'All',queue:[],cur:null,pmode:'none',playing:false,t:0,d:0,rate:1,sub:null,scroll:{home:0,library:0}};
const H={ids:[],recs:[],loading:false,err:false};

function fmt(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`}
function fmtViews(n){n=+n;if(!(n>=0))return '';if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+'M views';if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace('.0','')+'K views';return n+' views'}
const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
function avatar(name,big){const n=(name||'?').trim()||'?';const c=[...n][0];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return `<div class="avatar${big?' big':''}" style="background:hsl(${h} 45% 38%)">${esc(c.toUpperCase())}</div>`}
function tfetch(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||7000);return fetch(url,{signal:c.signal}).then(r=>{if(!r.ok)throw new Error('http');return r.json()}).finally(()=>clearTimeout(t))}
const P={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
 library:'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 4h10M5 6h14"/><path d="M10.5 11.5v5l4-2.5z" fill="currentColor"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',

 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',

 close:'<path d="M18 6L6 18M6 6l12 12"/>',
 more:'<circle cx="12" cy="5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="19" r="1.7" fill="currentColor"/>',
 play:'<path d="M7 4v16l13-8z" fill="currentColor"/>',
 pause:'<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>',
 rew:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text>',
 fwd:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.5" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">10</text>',
 chev:'<path d="M6 9l6 6 6-6"/>',

 save:'<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',

 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 list:'<path d="M3 6h13M3 12h13M3 18h8M19 14v6M16 17h6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 fs:'<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>',
 shuffle:'<path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>'
};
function ic(n,sz){sz=sz||24;return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]||''}</svg>`}

/* ============ data ============ */
const SYS=[{id:'wl',name:'Watch later',sys:true,items:[]},{id:'liked',name:'Liked videos',sys:true,items:[]}];
function migrate(){
  S.playlists=SYS.map(x=>({...x,items:[]}));S.meta={};S.hist=[];S.notes={};
  const of=ld('tubevault_folders_v2',null),ov=ld('tubevault_videos_v2',null),oh=ld('tubevault_history_v2',null),on=ld('tubevault_notes_v2',null);
  if(Array.isArray(of))of.forEach(f=>S.playlists.push({id:f.id,name:f.name,items:[]}));
  if(Array.isArray(ov))ov.slice().sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)).forEach(v=>{
    S.meta[v.videoId]={title:v.title,channel:v.channel};
    const p=S.playlists.find(x=>x.id===v.folderId)||S.playlists[0];
    if(!p.items.includes(v.videoId))p.items.unshift(v.videoId)});
  if(Array.isArray(oh))oh.forEach(h=>{S.meta[h.videoId]=Object.assign({title:h.title,channel:h.channel},S.meta[h.videoId]||{});S.hist.push({v:h.videoId,w:h.watchedSeconds||0,t:h.totalSeconds||0,at:h.watchedAt||Date.now()})});
  if(on&&typeof on==='object')S.notes=on;
  sv(K.pl,S.playlists);sv(K.meta,S.meta);sv(K.hist,S.hist);sv(K.notes,S.notes);
}
function load(){
  Object.assign(S.set,ld(K.set,{}));
  if(!Array.isArray(S.set.topics)||!S.set.topics.length)S.set.topics=DEF_TOPICS.slice();
  const pl=ld(K.pl,null);
  if(!pl)migrate();else{S.playlists=pl;S.meta=ld(K.meta,{});S.hist=ld(K.hist,[]);S.notes=ld(K.notes,{})}
  if(!Array.isArray(S.hist))S.hist=[];
  if(!S.playlists.some(p=>p.id==='liked'))S.playlists.unshift({...SYS[1],items:[]});
  if(!S.playlists.some(p=>p.id==='wl'))S.playlists.unshift({...SYS[0],items:[]});
  S.playlists.sort((a,b)=>(b.id==='wl')-(a.id==='wl')||(b.id==='liked')-(a.id==='liked')||0);
  // keep wl first then liked
  const wl=S.playlists.find(p=>p.id==='wl'),lk=S.playlists.find(p=>p.id==='liked');
  S.playlists=[wl,lk,...S.playlists.filter(p=>p!==wl&&p!==lk)];
}
let mt=null;
function setMeta(id,o){const m=S.meta[id]||(S.meta[id]={});for(const k in o){if(o[k]!==undefined&&o[k]!==null&&o[k]!=='')m[k]=o[k]}clearTimeout(mt);mt=setTimeout(()=>sv(K.meta,S.meta),500)}
const M=id=>{const m=S.meta[id]||{};return {title:m.title||'YouTube video',channel:m.channel||'',dur:m.dur||0,views:m.views||'',pub:m.pub||''}};
const subline=m=>[m.channel,m.views,m.pub].filter(Boolean).join(' • ');
const PL=id=>S.playlists.find(p=>p.id===id);
const inPl=(pid,vid)=>{const p=PL(pid);return !!p&&p.items.includes(vid)};
function togglePl(pid,vid){const p=PL(pid);if(!p)return false;const i=p.items.indexOf(vid);if(i>-1)p.items.splice(i,1);else{p.items.unshift(vid);ensureMeta(vid)}sv(K.pl,S.playlists);return i===-1}
const histMap=()=>{const m={};S.hist.forEach(h=>{m[h.v]=h});return m};
const pctOf=h=>h&&h.t>0?Math.min(100,Math.round(h.w/h.t*100)):0;
const metaPending=new Set();let refreshT=null;
function ensureMeta(id){
  const m=S.meta[id];if(m&&m.title)return;if(metaPending.has(id))return;metaPending.add(id);
  tfetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+id,8000).then(d=>{if(d&&d.title){setMeta(id,{title:d.title,channel:d.author_name});refreshViews()}}).catch(()=>{}).finally(()=>metaPending.delete(id));
}
function refreshViews(){clearTimeout(refreshT);refreshT=setTimeout(()=>{renderVisible();if(S.cur)updateWatchPage();if(clipCand&&$('clip').classList.contains('on'))showClip()},350)}
function histUpsert(id,w,t){
  const now=Date.now();const i=S.hist.findIndex(h=>h.v===id);let e;
  if(i>-1){e=S.hist[i];if(i>0){S.hist.splice(i,1);S.hist.unshift(e)}}else{e={v:id,w:0,t:0,at:now};S.hist.unshift(e);if(S.hist.length>300)S.hist.length=300}
  if(w!=null)e.w=Math.floor(w);if(t>0)e.t=Math.floor(t);e.at=now;sv(K.hist,S.hist);lastSave=now;
}
function extractId(s){
  if(!s)return null;s=s.trim();if(/^[\w-]{11}$/.test(s))return s;
  const r=[/[?&]v=([\w-]{11})/,/youtu\.be\/([\w-]{11})/,/youtube\.com\/(?:shorts|embed|live)\/([\w-]{11})/];
  for(const x of r){const m=s.match(x);if(m)return m[1]}return null}
function extractPlaylistId(s){
  if(!s)return null;s=s.trim();const m=s.match(/[?&]list=([\w-]{10,})/);if(m)return m[1];
  if(/^(PL|UU|OLAK5uy_|RD|FL|LL)[\w-]{10,}$/.test(s))return s;return null}

/* ============ online search ============ */
const INV=['https://inv.nadeko.net','https://yewtu.be','https://invidious.nerdvpn.de'];
const PIPED=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de'];
const scache=new Map();
async function onlineSearch(q){
  const key=q.toLowerCase();const c=scache.get(key);if(c&&Date.now()-c.t<6e5)return c.r;
  const e=encodeURIComponent(q);
  const tasks=[
    ...INV.map(b=>tfetch(`${b}/api/v1/search?q=${e}&type=video`,7000).then(d=>{const a=(Array.isArray(d)?d:[]).filter(x=>x.videoId&&x.title).map(x=>({id:x.videoId,title:x.title,channel:x.author,dur:x.lengthSeconds,views:fmtViews(x.viewCount),pub:x.publishedText}));if(!a.length)throw 0;return a})),
    ...PIPED.map(b=>tfetch(`${b}/search?q=${e}&filter=videos`,7000).then(d=>{const a=((d&&d.items)||[]).filter(x=>x.url&&x.url.includes('watch?v=')).map(x=>({id:x.url.split('v=')[1].split('&')[0],title:x.title,channel:x.uploaderName,dur:x.duration>0?x.duration:0,views:x.views>=0?fmtViews(x.views):'',pub:x.uploadedDate}));if(!a.length)throw 0;return a}))
  ];
  const r=await Promise.any(tasks);scache.set(key,{t:Date.now(),r});return r;
}
function ingest(list){return list.filter(x=>/^[\w-]{11}$/.test(x.id)).map(x=>{setMeta(x.id,{title:x.title,channel:x.channel,dur:x.dur,views:x.views,pub:x.pub});return x.id})}

/* ============ layers + history (Android back) ============ */
const stack=[];let sentinel=false,ignorePop=0,sTimer=null;
function pushLayer(close,kind){stack.push({close,kind});if(!sentinel){try{history.pushState({tv:1},'');sentinel=true}catch(e){}}}
function closeTopLayer(){
  const l=stack.pop();if(!l)return;try{l.close()}catch(e){console.error(e)}
  if(!stack.length&&sentinel){clearTimeout(sTimer);sTimer=setTimeout(()=>{if(!stack.length&&sentinel){sentinel=false;ignorePop++;history.back()}},150)}
}
window.addEventListener('popstate',()=>{
  if(ignorePop>0){ignorePop--;return}
  sentinel=false;const l=stack.pop();
  if(l){try{l.close()}catch(e){console.error(e)}if(stack.length){try{history.pushState({tv:1},'');sentinel=true}catch(e){}}}
});

/* ============ sheet / toast ============ */
let sheetOpen=false,confirmFn=null;
function openSheet(html){
  const r=$('sheet-root');
  if(!sheetOpen){sheetOpen=true;r.classList.add('on');pushLayer(()=>{sheetOpen=false;r.classList.remove('on');r.innerHTML=''},'sheet')}
  r.innerHTML=`<div class="sbackdrop" data-act="sheet-close"></div><div class="spanel">${html}</div>`;
}
function closeSheet(){if(sheetOpen)closeTopLayer()}
let toastT=null;
function toast(msg){const t=$('toast');t.innerHTML=`<div>${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{t.innerHTML=''},2400)}
function confirmSheet(title,msg,ok,fn){confirmFn=fn;openSheet(`<div class="shead">${esc(title)}</div><p class="hint" style="font-size:14px">${esc(msg)}</p><div class="srow"><button class="btn grow" data-act="sheet-close">Cancel</button><button class="btn red grow" data-act="confirm-ok">${esc(ok)}</button></div>`)}

/* ============ sub pages ============ */
let subOpen=false;
function openSub(kind,html,full){
  const r=$('sub');r.className='on'+(full?' full':'');r.innerHTML=html;r.scrollTop=0;
  if(!subOpen){subOpen=true;pushLayer(()=>{subOpen=false;r.className='';r.innerHTML='';S.sub=null},'sub')}
  S.sub=Object.assign({},kind);
}
function closeSub(){if(subOpen){if(stack.length&&stack[stack.length-1].kind==='sub')closeTopLayer()}}
const subHeader=(title,right)=>`<div class="subhead"><button class="ib" data-act="sub-back" aria-label="Back">${ic('back')}</button><h2>${title}</h2>${right||''}</div>`;

/* ============ rendering: cards & rows ============ */
function cardHtml(id,ctx,hm){
  const m=M(id),h=hm[id],pct=pctOf(h),dur=m.dur||(h&&h.t)||0;
  return `<article class="card" data-act="play" data-id="${id}" data-ctx="${ctx}"><div class="thumb"><img src="${thumb(id)}" loading="lazy" decoding="async" alt="">${dur?`<span class="dur">${fmt(dur)}</span>`:''}${pct>0?`<div class="prog"><i style="width:${pct}%"></i></div>`:''}</div><div class="cmeta">${avatar(m.channel)}<div class="ct"><h3>${esc(m.title)}</h3><p>${esc(subline(m))}</p></div><button class="ib" data-act="menu" data-id="${id}" aria-label="More">${ic('more')}</button></div></article>`;
}
function rowHtml(id,ctx,hm,pl){
  const m=M(id),h=hm[id],pct=pctOf(h),dur=m.dur||(h&&h.t)||0;
  return `<div class="row" data-act="play" data-id="${id}" data-ctx="${ctx}"${pl?` data-pl="${pl}"`:''}><div class="rthumb"><img src="${thumb(id)}" loading="lazy" decoding="async" alt="">${dur?`<span class="dur">${fmt(dur)}</span>`:''}${pct>0?`<div class="prog"><i style="width:${pct}%"></i></div>`:''}</div><div class="ct"><h3>${esc(m.title)}</h3><p>${esc(subline(m))}</p></div><button class="ib" data-act="menu" data-id="${id}" aria-label="More">${ic('more')}</button></div>`;
}
const skelCards=n=>Array.from({length:n},()=>`<div class="card"><div class="thumb sk"></div><div class="cmeta"><div class="avatar sk"></div><div class="ct"><div class="sk line"></div><div class="sk line s"></div></div></div></div>`).join('');
const skelRows=n=>Array.from({length:n},()=>`<div class="row"><div class="rthumb sk"></div><div class="ct"><div class="sk line"></div><div class="sk line s"></div></div></div>`).join('');

/* ============ HOME ============ */
let homeTok=0;
function personalFeed(){
  const hm=histMap(),out=[],seen=new Set();const push=id=>{if(!seen.has(id)){seen.add(id);out.push(id)}};
  S.hist.filter(h=>h.t>0&&h.w/h.t>=.03&&h.w/h.t<.95).slice(0,4).forEach(h=>push(h.v));
  S.playlists.filter(p=>p.id!=='liked').forEach(p=>p.items.forEach(id=>{const h=hm[id];if(!h||!h.t||h.w/h.t<.95)push(id)}));
  return out;
}
function topChannels(n){
  const c={};const add=(id,w)=>{const ch=(S.meta[id]||{}).channel;if(ch&&ch!=='YouTube')c[ch]=(c[ch]||0)+w};
  S.hist.slice(0,40).forEach(h=>add(h.v,2));S.playlists.forEach(p=>p.items.slice(0,30).forEach(id=>add(id,1)));
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
}
function renderChips(){$('chips').innerHTML=['All',...S.set.topics].map(c=>`<button class="chip${c===S.chip?' on':''}" data-act="chip" data-v="${esc(c)}">${esc(c)}</button>`).join('')}
function renderFeed(){
  const el=$('feed');
  if(H.loading){el.innerHTML=skelCards(6);return}
  if(H.err){el.innerHTML=`<div class="empty" style="grid-column:1/-1">Couldn't load videos right now.<br>Public search services are sometimes busy.<br><br><button class="btn pri" data-act="retry">Try again</button></div>`;return}
  ctxLists.home=H.ids.concat(H.recs||[]);
  const hm=histMap();
  el.innerHTML=H.ids.length?H.ids.map(id=>cardHtml(id,'home',hm)).join(''):`<div class="empty" style="grid-column:1/-1">Nothing here yet.<br>Pick a topic above, or tap + to add a video.</div>`;
}
async function loadHome(){
  const my=++homeTok;H.err=false;H.recs=[];$('feed-more').innerHTML='';moreN=0;
  if(S.chip==='All'){
    H.ids=personalFeed();$('feed-extra').innerHTML='';
    if(!H.ids.length&&!topChannels(1).length){S.chip=S.set.topics[0]||'JEE';renderChips();return loadHome()}
    H.loading=false;renderFeed();loadRecs(my);return;
  }
  $('feed-extra').innerHTML='';H.loading=true;renderFeed();
  try{const r=await onlineSearch(S.chip);if(my!==homeTok)return;H.ids=ingest(r);H.loading=false}
  catch(e){if(my!==homeTok)return;H.loading=false;H.err=true;H.ids=[]}
  renderFeed();
}
async function loadRecs(my){
  const names=topChannels(2);if(!names.length)return;
  const ex=$('feed-extra');ex.innerHTML=`<div class="sechead">Recommended for you</div><div class="feed">${skelCards(3)}</div>`;
  const rs=await Promise.allSettled(names.map(n=>onlineSearch(n)));
  if(my!==homeTok||S.chip!=='All')return;
  const seen=new Set(H.ids),ids=[];
  rs.forEach(r=>{if(r.status==='fulfilled')ingest(r.value).forEach(id=>{if(!seen.has(id)){seen.add(id);ids.push(id)}})});
  if(!ids.length){ex.innerHTML='';return}
  H.recs=ids;ctxLists.home=H.ids.concat(ids);const hm=histMap();
  ex.innerHTML=`<div class="sechead">Recommended for you</div><div class="feed">${ids.map(id=>cardHtml(id,'home',hm)).join('')}</div>`;
}

function renderHistList(){
  const el=$('hist-list');if(!el)return;
  const q=($('hist-q')&&$('hist-q').value||'').toLowerCase().trim(),hm=histMap();
  const items=S.hist.filter(h=>{const m=M(h.v);return !q||m.title.toLowerCase().includes(q)||m.channel.toLowerCase().includes(q)});
  ctxLists.histpage=items.map(h=>h.v);
  if(!items.length){el.innerHTML=`<div class="empty">${q?'No matches':'No watch history yet'}</div>`;return}
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),y0=t0-864e5;
  const g={Today:[],Yesterday:[],Earlier:[]};items.forEach(h=>(h.at>=t0?g.Today:h.at>=y0?g.Yesterday:g.Earlier).push(h.v));
  el.innerHTML=Object.entries(g).filter(x=>x[1].length).map(([k,l])=>`<div class="glabel">${k}</div>${l.map(id=>rowHtml(id,'histpage',hm)).join('')}`).join('');

/* ============ SEARCH page ============ */
let searchTok=0;
function openSearch(){
  openSub({kind:'search'},`<form class="shead2" data-form="search"><button type="button" class="ib" data-act="sub-back">${ic('back')}</button><input id="sq" placeholder="Search" enterkeyhint="search" autocomplete="off"><button class="ib" type="submit">${ic('search')}</button></form><div id="sbody"></div>`,true);
  renderSearchRecent('');setTimeout(()=>{const i=$('sq');i&&i.focus()},60);
}
function renderSearchRecent(q){
  const list=ld('tv3_q',[]).filter(x=>!q||x.toLowerCase().includes(q.toLowerCase())).slice(0,10);
  $('sbody').innerHTML=list.map(x=>`<button class="qrow" data-act="q-go" data-v="${esc(x)}">${ic('clock',20)}<span>${esc(x)}</span></button>`).join('')||`<div class="empty">Search YouTube, your saved videos and history.</div>`;
}
function localMatches(q){
  q=q.toLowerCase();const ids=new Set();S.playlists.forEach(p=>p.items.forEach(i=>ids.add(i)));S.hist.forEach(h=>ids.add(h.v));
  return [...ids].filter(id=>{const m=M(id);return m.title.toLowerCase().includes(q)||m.channel.toLowerCase().includes(q)}).slice(0,8);
}
async function runSearch(q){
  q=(q||'').trim();if(!q)return;
  const rec=ld('tv3_q',[]).filter(x=>x.toLowerCase()!==q.toLowerCase());rec.unshift(q);sv('tv3_q',rec.slice(0,12));
  const inp=$('sq');if(inp){inp.value=q;inp.blur()}
  const my=++searchTok,hm=histMap(),local=localMatches(q);ctxLists.search=local.slice();
  $('sbody').innerHTML=(local.length?`<div class="sechead">In your library</div>${local.map(id=>rowHtml(id,'search',hm)).join('')}`:'')+`<div class="sechead">From YouTube</div><div id="sonline">${skelRows(6)}</div>`;
  try{
    const r=await onlineSearch(q);if(my!==searchTok)return;
    const ids=ingest(r).filter(id=>!local.includes(id));ctxLists.search=local.concat(ids);
    $('sonline').innerHTML=ids.map(id=>rowHtml(id,'search',hm)).join('')||`<div class="empty">No results</div>`;
  }catch(e){
    if(my!==searchTok)return;
    $('sonline').innerHTML=`<div class="empty">Couldn't reach YouTube search right now.<br>Public search services are sometimes busy.<br><br><button class="btn pri" data-act="q-go" data-v="${esc(q)}">Retry</button></div>`;
  }
}

let addTok=0,addMeta=null;
async function onAddInput(v){
  const id=extractId(v),pid=extractPlaylistId(v),prev=$('add-prev'),hint=$('add-hint');if(!prev)return;
  addMeta=null;
  if(pid&&(!id||/playlist\?/.test(v))){prev.hidden=true;hint.innerHTML=`Playlist link detected — <a href="#" data-act="open-import-link" style="color:var(--blue)">import all its videos</a>`;return}
  if(!id){prev.hidden=true;hint.textContent=v.trim()?'That doesn’t look like a YouTube link.':'Supports watch, shorts, youtu.be, embed links or 11-character IDs.';return}
  hint.textContent='Video found';prev.hidden=false;$('add-img').src=thumb(id);
  const have=S.meta[id];$('add-title').textContent=(have&&have.title)||'Loading…';$('add-chan').textContent=(have&&have.channel)||'';
  const my=++addTok;
  if(have&&have.title){addMeta={id,title:have.title,channel:have.channel};return}
  try{const d=await tfetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+id,8000);if(my!==addTok||!$('add-title'))return;
    if(d&&d.title){addMeta={id,title:d.title,channel:d.author_name};$('add-title').textContent=d.title;$('add-chan').textContent=d.author_name||''}else $('add-title').textContent='YouTube video'}
  catch(e){if(my===addTok&&$('add-title'))$('add-title').textContent='YouTube video'}
}
function addSubmit(play){
  const id=extractId($('add-url').value);if(!id){toast('Enter a valid YouTube link');return}
  if(addMeta&&addMeta.id===id)setMeta(id,{title:addMeta.title,channel:addMeta.channel});
  const pid=$('add-pl').value||'wl',p=PL(pid);
  if(p&&!p.items.includes(id)){p.items.unshift(id);sv(K.pl,S.playlists)}
  ensureMeta(id);closeSheet();renderVisible();
  if(play)playVideo(id,{queue:[id]});else toast('Saved to '+(p?p.name:'playlist'));
}

async function fetchPlaylist(pid){
  const rss=(async()=>{try{const d=await tfetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://www.youtube.com/feeds/videos.xml?playlist_id='+pid),9000);
    if(d&&d.status==='ok')return {title:((d.feed&&d.feed.title)||'').replace(/\s*-\s*YouTube$/i,''),items:(d.items||[]).map(i=>({id:extractId(i.link||''),title:i.title,channel:i.author})).filter(i=>i.id)}}catch(e){}return {title:'',items:[]}})();
  const web=(async()=>{try{const r=await tfetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://www.youtube.com/playlist?list='+pid),12000);const html=(r&&r.contents)||'';const items=[];let title='';
    const tm=html.match(/<title>([^<]+)<\/title>/i);if(tm)title=tm[1].replace(/\s*-\s*YouTube$/i,'').trim();
    const re=/"playlistVideoRenderer":\{"videoId":"([\w-]{11})"[\s\S]*?"title":\{"runs":\[\{"text":"((?:[^"\\]|\\.)*)"\}\]/g;let m;
    while((m=re.exec(html))){let t=m[2];try{t=JSON.parse('"'+t+'"')}catch(e){}items.push({id:m[1],title:t,channel:''})}
    return {title,items}}catch(e){}return {title:'',items:[]}})();
  const [a,b]=await Promise.all([rss,web]);const map=new Map();
  b.items.concat(a.items).forEach(i=>{if(!map.has(i.id))map.set(i.id,i)});
  return {title:b.title||a.title,items:[...map.values()]};
}
async function loadImport(){
  const text=$('imp-text').value,st=$('imp-status'),btn=$('imp-load');
  const ids=[...new Set(text.split(/[\s,]+/).filter(Boolean).map(extractId).filter(Boolean))],pid=extractPlaylistId(text);
  if(pid&&(ids.length<=1||/playlist\?/.test(text))){
    btn.disabled=true;btn.textContent='Loading…';st.textContent='Reading playlist…';
    const r=await fetchPlaylist(pid);if(!$('imp-text'))return;btn.disabled=false;btn.textContent='Load videos';
    if(!r.items.length){st.textContent='Couldn’t read that playlist. Make sure it is Public or Unlisted (not Private).';return}
    imp={items:r.items.map(i=>({...i,on:true})),name:r.title||'Imported playlist'};st.textContent=`Found ${r.items.length} videos.`;showImpResults();return;
  }
  if(ids.length){imp={items:ids.map(id=>({id,title:(S.meta[id]||{}).title||'',channel:(S.meta[id]||{}).channel||'',on:true})),name:`Imported (${ids.length})`};
    st.textContent=`Found ${ids.length} video${ids.length===1?'':'s'}.`;showImpResults();imp.items.forEach(i=>{if(!i.title)ensureMetaThen(i)});return}
  st.textContent='No YouTube links found in that text.';
}
function ensureMetaThen(i){tfetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v='+i.id,8000).then(d=>{if(d&&d.title){i.title=d.title;i.channel=d.author_name||'';if($('imp-list'))renderImpList()}}).catch(()=>{})}
function showImpResults(){
  const el=$('imp-results');el.hidden=false;
  el.innerHTML=`<span class="lbl">Destination</span><select id="imp-dest"><option value="new">New playlist</option>${S.playlists.filter(p=>p.id!=='liked').map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
  <input id="imp-name" style="margin-top:8px" value="${esc(imp.name)}" placeholder="Playlist name">
  <div style="display:flex;align-items:center;margin-top:12px"><b id="imp-sum" style="flex:1"></b><button class="link" data-act="imp-all">Select all</button><button class="link" style="margin-left:14px;color:var(--tx2)" data-act="imp-none">Clear</button></div>
  <div id="imp-list"></div><div class="srow"><button class="btn red grow" id="imp-go" data-act="imp-go">Import</button></div>`;
  renderImpList();
}
function renderImpList(){
  const n=imp.items.filter(i=>i.on).length;$('imp-sum').textContent=`${n} of ${imp.items.length} selected`;
  $('imp-go').disabled=!n;$('imp-go').textContent=`Import ${n} video${n===1?'':'s'}`;
  $('imp-list').innerHTML=imp.items.map((i,x)=>`<label class="chk"><input type="checkbox" data-i="${x}" ${i.on?'checked':''}><img src="${thumb(i.id)}" loading="lazy" alt=""><span>${esc(i.title||'YouTube video')}</span></label>`).join('');
}
function executeImport(){
  const sel=imp.items.filter(i=>i.on);if(!sel.length)return;
  const dest=$('imp-dest').value;let p;
  if(dest==='new'){p={id:'pl-'+Date.now(),name:($('imp-name').value.trim()||'Imported playlist'),items:[]};S.playlists.push(p)}else p=PL(dest);
  sel.forEach(i=>setMeta(i.id,{title:i.title,channel:i.channel}));
  const ids=sel.map(i=>i.id);p.items=[...ids,...p.items.filter(x=>!ids.includes(x))];sv(K.pl,S.playlists);
  closeSheet();renderVisible();toast(`Imported ${ids.length} video${ids.length===1?'':'s'} to “${p.name}”`);ids.forEach(ensureMeta);
}

let yt=null,ytReady=false,playerReady=false,pending=null,tick=null,lastSave=0,ctrlTimer=null,isDrag=false;
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(pending&&!yt){createPlayer(pending.id,pending.start);pending=null}};
(function(){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;document.head.appendChild(s)})();
function createPlayer(id,start){
  $('yt-host').innerHTML='<div id="yt-el"></div>';
  const v={autoplay:1,controls:0,playsinline:1,rel:0,modestbranding:1,iv_load_policy:3,disablekb:1,fs:0,start:Math.floor(start||0)};
  if(/^https?:$/.test(location.protocol))v.origin=location.origin;
  yt=new YT.Player('yt-el',{host:'https://www.youtube-nocookie.com',videoId:id,playerVars:v,events:{
    onReady:e=>{playerReady=true;try{e.target.setPlaybackRate(S.rate)}catch(x){}
      if(pending){e.target.loadVideoById({videoId:pending.id,startSeconds:pending.start});pending=null}},
    onStateChange:onState,
    onError:()=>{toast('This video can’t be played in-app');}}});
}
function loadInPlayer(id,start){
  if(playerReady){yt.loadVideoById({videoId:id,startSeconds:start});try{yt.setPlaybackRate(S.rate)}catch(e){}}
  else if(yt){pending={id,start}}
  else if(ytReady){createPlayer(id,start)}
  else pending={id,start};
}
function onState(e){
  const st=e.data;S.playing=(st===1);
  if(st===1){try{const d=yt.getDuration();if(d>0){S.d=d;if(S.cur&&M(S.cur).dur!==Math.floor(d))setMeta(S.cur,{dur:Math.floor(d)})}}catch(x){}startTick();showCtrls()}
  if(st===2){saveProg(true);$('ctrl').classList.add('show');clearTimeout(ctrlTimer)}
  if(st===0){if(S.cur)histUpsert(S.cur,S.d,S.d);if(S.set.autoplay!==false)playNext()}
  updatePlayUI();
}
function startTick(){
  if(tick)return;
  tick=setInterval(()=>{
    if(!playerReady||!S.cur)return;
    try{const t=yt.getCurrentTime(),d=yt.getDuration();if(typeof t==='number')S.t=t;if(d>0)S.d=d;
      if(!isDrag)paintProg();if(S.playing&&Date.now()-lastSave>5000)saveProg()}catch(e){}
  },500);
}
function saveProg(){if(!S.cur||!S.d)return;histUpsert(S.cur,S.t,S.d)}
function paintProg(){
  const d=S.d||0,t=S.t||0,p=d>0?Math.min(100,t/d*100):0;
  $('sc-fill').style.width=p+'%';$('sc-knob').style.left=p+'%';$('mini-prog').style.width=p+'%';
  $('c-time').textContent=fmt(t)+' / '+(d?fmt(d):'--:--');$('wp-pct').textContent=Math.round(p)+'% watched';
}
function updatePlayUI(){
  const i=ic(S.playing?'pause':'play',S.playing?26:28);
  $('c-play').innerHTML=i;$('mini-play').innerHTML=ic(S.playing?'pause':'play',22);
}
function showCtrls(){const c=$('ctrl');c.classList.add('show');clearTimeout(ctrlTimer);if(S.playing)ctrlTimer=setTimeout(()=>c.classList.remove('show'),3000)}
function togglePlay(){if(!playerReady)return;try{S.playing?yt.pauseVideo():yt.playVideo()}catch(e){}}
function seekTo(s){if(!playerReady)return;S.t=Math.max(0,Math.min(S.d||s,s));try{yt.seekTo(S.t,true)}catch(e){}paintProg();saveProg()}
function seekRel(d){seekTo((S.t||0)+d)}
function playNext(){const i=S.queue.indexOf(S.cur);if(i>-1&&i<S.queue.length-1)playVideo(S.queue[i+1],{keepQueue:true})}
function cycleSpeed(){const sp=[1,1.25,1.5,2,0.75];S.rate=sp[(sp.indexOf(S.rate)+1)%sp.length];$('c-speed').textContent=S.rate+'x';if(playerReady)try{yt.setPlaybackRate(S.rate)}catch(e){}}
function exitFs(){try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
function lockLand(on){try{const r=on?screen.orientation.lock('landscape'):screen.orientation.unlock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}
function toggleFs(){
  const pv=$('pv');
  if(document.fullscreenElement||document.webkitFullscreenElement){exitFs();lockLand(false)}
  else{const f=pv.requestFullscreen||pv.webkitRequestFullscreen;if(f){const p=f.call(pv);Promise.resolve(p).then(()=>lockLand(true)).catch(()=>{})}}
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)lockLand(false)});
function playVideo(id,o){
  o=o||{};if(!id)return;
  if(!o.keepQueue){if(o.queue&&o.queue.length)S.queue=o.queue.slice();else if(!S.queue.includes(id))S.queue=[id]}
  if(!S.queue.includes(id))S.queue=[id];
  const h=histMap()[id];
  let start=o.start!=null?o.start:(h&&h.t>0&&h.w/h.t<.95?h.w:0);if(start<3)start=0;
  S.cur=id;S.t=start;S.d=(h&&h.t)||M(id).dur||0;ensureMeta(id);
  openPlayerUI();updateWatchPage();paintProg();
  loadInPlayer(id,start);histUpsert(id,start,0);startTick();
  const ex=$('notes-box');if(ex&&!ex.hidden)renderNotes();
}
function openPlayerUI(){
  if(S.pmode==='full')return;if(S.pmode==='mini'){expandPlayer();return}
  $('player-layer').className='on full';S.pmode='full';document.body.classList.remove('has-mini');
  pushLayer(playerClose,'player');showCtrls();
}
function playerClose(){if(S.set.playerMode==='mini')minimize();else stopPlayer()}
function minimize(){exitFs();saveProg();$('player-layer').className='on mini';S.pmode='mini';document.body.classList.add('has-mini')}
function expandPlayer(){
  if(S.pmode!=='mini')return;$('player-layer').className='on full';S.pmode='full';document.body.classList.remove('has-mini');
  pushLayer(playerClose,'player');updateWatchPage();showCtrls();
}
function stopPlayer(){
  exitFs();saveProg();try{playerReady&&yt.stopVideo()}catch(e){}
  clearInterval(tick);tick=null;S.cur=null;S.playing=false;S.pmode='none';S.t=0;S.d=0;
  $('player-layer').className='';document.body.classList.remove('has-mini');updatePlayUI();

function updateWatchPage(){
  const id=S.cur;if(!id)return;const m=M(id);
  $('wp-title').textContent=m.title;$('wp-chan').textContent=m.channel||'YouTube';$('wp-av').innerHTML=avatar(m.channel);

function renderUpNext(){
  const el=$('upnext');if(!el)return;
  const i=S.queue.indexOf(S.cur);let ids=i>-1?S.queue.slice(i+1):[];
  if(ids.length<4){personalFeed().concat(H.ids).forEach(x=>{if(x!==S.cur&&!ids.includes(x)&&!S.queue.includes(x))ids.push(x)})}

  const hm=histMap();el.innerHTML=ids.length?ids.map(id=>rowHtml(id,'upnext',hm)).join(''):`<div class="empty" style="padding:20px">Nothing queued. Save videos or pick a topic on Home.</div>`;

function renderNotes(){
  const el=$('notes-list');if(!el||!S.cur)return;const list=S.notes[S.cur]||[];
  el.innerHTML=list.length?list.map(n=>`<div class="note" style="padding-left:0"><button class="tsb" data-act="seek-ts" data-ts="${n.timestamp}">${fmt(n.timestamp)}</button><span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(n.text)}</span><button class="ib" data-act="note-del" data-id="${S.cur}" data-nid="${n.id}">${ic('close',18)}</button></div>`).join(''):`<p class="hint">No notes pinned for this video yet.</p>`;

/* controls events */
(function(){
  let lastTap=0,tapT=null;
  const sh=$('shield');
  sh.addEventListener('click',e=>{
    if(S.pmode==='mini'){expandPlayer();return}
    const r=sh.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,now=Date.now();
    if(now-lastTap<300){clearTimeout(tapT);lastTap=0;
      if(x<.4){seekRel(-10);badge('bl')}else if(x>.6){seekRel(10);badge('br')}else togglePlay();return}
    lastTap=now;clearTimeout(tapT);
    tapT=setTimeout(()=>{const c=$('ctrl');if(c.classList.contains('show'))c.classList.remove('show');else showCtrls()},280);
  });
  function badge(id){const b=$(id);b.classList.remove('go');void b.offsetWidth;b.classList.add('go')}
  const sc=$('scrub');
  const pos=e=>{const r=sc.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
  sc.addEventListener('pointerdown',e=>{if(!S.d)return;isDrag=true;try{sc.setPointerCapture(e.pointerId)}catch(x){}S.t=pos(e)*S.d;paintProg();clearTimeout(ctrlTimer)});
  sc.addEventListener('pointermove',e=>{if(!isDrag)return;S.t=pos(e)*S.d;paintProg()});
  sc.addEventListener('pointerup',e=>{if(!isDrag)return;isDrag=false;seekTo(pos(e)*S.d);showCtrls()});
  sc.addEventListener('pointercancel',()=>{isDrag=false});
})();

function setTab(t,init){
  if(!init)S.scroll[S.tab]=window.scrollY;
  S.tab=t;$('view-home').hidden=t!=='home';$('view-library').hidden=t!=='library';
  $('nav-home').classList.toggle('on',t==='home');$('nav-library').classList.toggle('on',t==='library');
  if(t==='library')renderLibrary();else if(!init&&S.chip==='All'){H.ids=personalFeed();renderFeed()}
  window.scrollTo(0,S.scroll[t]||0);
}
function renderVisible(){
  if(subOpen&&S.sub){const k=S.sub.kind;if(k==='hist')renderHistList();else if(k==='pl')renderPlPage();else if(k==='notes')renderNotesPage()}
  if(S.tab==='library')renderLibrary();else if(!H.loading)renderFeed();
  if(S.cur&&$('upnext'))renderUpNext();
}

});
document.addEventListener('submit',e=>{const f=e.target.dataset&&e.target.dataset.form;if(f&&FORMS[f]){e.preventDefault();FORMS[f]()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='add-url')onAddInput(t.value);
  else if(t.id==='hist-q')renderHistList();
  else if(t.id==='sq'&&!t.value.trim())renderSearchRecent('');
  else if(t.id==='sq')renderSearchRecent(t.value);
  else if(t.id==='imp-name')imp.name=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.i!==undefined&&t.type==='checkbox'){imp.items[+t.dataset.i].on=t.checked;const n=imp.items.filter(i=>i.on).length;$('imp-sum').textContent=`${n} of ${imp.items.length} selected`;$('imp-go').disabled=!n;$('imp-go').textContent=`Import ${n} video${n===1?'':'s'}`}
  else if(t.id==='imp-dest'){$('imp-name').hidden=t.value!=='new'}
  else if(t.id==='topics-in'){
    const l=[...new Set(t.value.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,14);
    S.set.topics=l.length?l:DEF_TOPICS.slice();sv(K.set,S.set);if(S.chip!=='All'&&!S.set.topics.includes(S.chip))S.chip='All';renderChips();
  }
});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)closeTopLayer()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProg();else setTimeout(checkClip,300)});
window.addEventListener('pagehide',saveProg);

/* ============ clipboard + incoming share ============ */
let clipCand=null,clipDismissed='';
async function checkClip(){
  if(!navigator.clipboard||!navigator.clipboard.readText||S.pmode==='full'||sheetOpen)return;
  try{
    const t=((await navigator.clipboard.readText())||'').trim();
    if(!t||t.length>400||t===clipDismissed||!/youtu\.?be|youtube\.com/i.test(t))return;
    const pl=extractPlaylistId(t),id=extractId(t);if(!pl&&!id)return;if(id&&S.cur===id&&!pl)return;
    clipCand={t,pl:pl&&(!id||/playlist\?/.test(t))?pl:null,id};showClip();
  }catch(e){}
}
function showClip(){
  const c=clipCand,el=$('clip');if(!c)return;el.className='on';
  if(c.pl)el.innerHTML=`<div class="cl"><div class="avatar" style="background:var(--red)">${ic('download',20)}</div><div class="ct" style="flex:1"><h4>Playlist link copied</h4><p>Import all its videos</p></div><button class="btn pri" data-act="clip-go">Import</button><button class="ib" data-act="clip-x">${ic('close',20)}</button></div>`;
  else{ensureMeta(c.id);el.innerHTML=`<div class="cl"><img src="${thumb(c.id)}" alt=""><div class="ct" style="flex:1;min-width:0"><h4>${esc(M(c.id).title)}</h4><p>YouTube link copied</p></div><button class="btn" data-act="clip-save">Save</button><button class="btn pri" data-act="clip-go">Play</button><button class="ib" data-act="clip-x">${ic('close',20)}</button></div>`}
}
function dismissClip(){if(clipCand)clipDismissed=clipCand.t;$('clip').className='';clipCand=null}
function acceptClip(play){
  const c=clipCand;if(!c)return;dismissClip();
  if(c.pl){openImport('https://www.youtube.com/playlist?list='+c.pl);return}
  const wl=PL('wl');if(!wl.items.includes(c.id)){wl.items.unshift(c.id);sv(K.pl,S.playlists)}ensureMeta(c.id);renderVisible();
  if(play)playVideo(c.id,{queue:[c.id]});else toast('Saved to Watch later');
}
function handleShare(){
  try{
    const p=new URLSearchParams(location.search);
    const raw=[p.get('url'),p.get('text'),p.get('v')?'https://www.youtube.com/watch?v='+p.get('v'):'',p.get('list')?'https://www.youtube.com/playlist?list='+p.get('list'):''].filter(Boolean).join(' ').trim();
    if(!raw)return false;
    if(history.replaceState)history.replaceState({},document.title,location.pathname);
    const pl=extractPlaylistId(raw),id=extractId(raw);
    if(pl&&(!id||/playlist\?/.test(raw))){setTab('library');openImport('https://www.youtube.com/playlist?list='+pl);return true}
    if(id){const wl=PL('wl');if(!wl.items.includes(id)){wl.items.unshift(id);sv(K.pl,S.playlists)}if(p.get('title'))setMeta(id,{title:p.get('title')});ensureMeta(id);playVideo(id,{queue:[id]});toast('Playing shared video');return true}
  }catch(e){}
  return false;
}

/* ============ init ============ */
function init(){
  load();
  $('search-btn').innerHTML=ic('search');$('add-btn').innerHTML=ic('plus');
  $('nav-home').innerHTML=ic('home')+'<span>Home</span>';$('nav-library').innerHTML=ic('library')+'<span>Library</span>';
  $('c-rew').innerHTML=ic('rew',30);$('c-fwd').innerHTML=ic('fwd',30);$('c-fs').innerHTML=ic('fs',22);$('mini-close').innerHTML=ic('close',22);
  updatePlayUI();applyTheme();renderChips();setTab('home',true);loadHome();
  handleShare();setTimeout(checkClip,900);window.addEventListener('focus',()=>setTimeout(checkClip,300));
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
